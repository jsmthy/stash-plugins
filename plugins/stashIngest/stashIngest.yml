# example plugin config
name: Stash Ingest
description: Moves identified scenes from the ".StashIngest" folder to the root "Scenes" folder.
version: 1.1.1
exec:
  - stashIngest.js
interface: js
settings:
  handleDuplicates:
    displayName: Handle Duplicates
    description: Compare quality of incoming files against existing duplicates and keep the preferred version. Losers moved to .StashDuplicates.
    type: BOOLEAN
  vrTagName:
    displayName: VR Tag Name
    description: Tag name used to identify VR scenes. VR scenes always prefer highest resolution.
    type: STRING
hooks:
  - name: Run on scene create and update.
    description: Updates scene info whenever a new scene is added.
    triggeredBy:
      - Scene.Update.Post
      - Scene.Create.Post