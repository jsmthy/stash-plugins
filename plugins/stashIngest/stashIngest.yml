# example plugin config
name: Stash Ingest
description: Moves identified scenes from the ".StashIngest" folder to the root "Scenes" folder.
version: 1.1.1
exec:
  - stashIngest.js
interface: js
settings:
  handleDuplicates:
    displayName: Handle Duplicates
    description: "Detects duplicates by phash match. 2D: prefers 1080p, keeps higher if below, keeps closest to 1080p if above. VR: always keeps highest resolution. Equal resolution: prefers better codec (av1 > hevc > h264). Rejected file is moved to .StashDuplicates."
    type: BOOLEAN
  vrTagName:
    displayName: VR Tag Name
    description: Scenes with this tag are treated as VR content. Leave blank to use the default (VR).
    type: STRING
hooks:
  - name: Run on scene create and update.
    description: Updates scene info whenever a new scene is added.
    triggeredBy:
      - Scene.Update.Post
      - Scene.Create.Post